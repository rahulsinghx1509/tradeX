# TradeX on the server. Use deploy/tradex.sh instead of calling this directly;
# it passes the repo's .env file in for you.
name: tradex

x-app: &app
  build:
    context: ..
    dockerfile: deploy/Dockerfile.backend
  image: tradex-backend
  env_file: ../.env
  environment:
    # The database runs in its own container called "db"; this overrides any DATABASE_URL in .env.
    DATABASE_URL: postgresql://tradex:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/tradex
  volumes:
    - ../reports:/app/reports
  restart: unless-stopped

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tradex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: tradex
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradex -d tradex"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    # No "ports": the database is reachable only by the other containers.

  migrate:
    <<: *app
    command: ["sh", "-c", "cd backend && alembic upgrade head"]
    restart: "no"
    depends_on:
      db: { condition: service_healthy }

  api:
    <<: *app
    depends_on:
      migrate: { condition: service_completed_successfully }

  collector:
    <<: *app
    command: ["python", "scripts/run_collector.py"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  # 9/21 EMA trade viewer (Flask), at http://<server>/ema/. Read-only, no Groww access needed.
  ema:
    <<: *app
    command: ["python", "scripts/ema921_viewer.py", "--host", "0.0.0.0", "--port", "8050"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  # 9/21 EMA PAPER engine: PAPER Telegram messages during market hours. Never places orders.
  # Change its settings in .env (EMA921_PAPER_TF / _START / _CUTOFF / _MODES), then
  # deploy/tradex.sh restart ema-paper. To switch it off: deploy/tradex.sh stop-paper
  ema-paper:
    <<: *app
    command: ["sh", "-c", "python scripts/ema921_paper.py --tf $${EMA921_PAPER_TF:-5} --start $${EMA921_PAPER_START:-09:30} --cutoff $${EMA921_PAPER_CUTOFF:-14:30} --modes $${EMA921_PAPER_MODES:-all}"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  # Multi-strategy PAPER signals (EMA-921, ORB-1.0, ET-1.0), numbered trades on Telegram.
  # Never places orders. Switch off: SIGNALS_OFF=1 in .env, then deploy/tradex.sh restart signals
  signals:
    <<: *app
    command: ["sh", "-c", "python scripts/signals_paper.py --strategies $${SIGNALS_STRATEGIES:-all} --mode $${SIGNALS_MODE:-ATM_BUY}"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  dashboard:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    image: tradex-dashboard
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on: [api, dashboard, ema]
    restart: unless-stopped

volumes:
  pgdata:
