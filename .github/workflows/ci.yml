name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tradex
          POSTGRES_PASSWORD: change_me
          POSTGRES_DB: tradex_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check . ../scripts
      - name: Migrations apply cleanly
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql://tradex:change_me@localhost:5432/tradex_test
      - name: Tests (SQLite)
        run: python -m pytest -q
      - name: Tests (PostgreSQL)
        run: python -m pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://tradex:change_me@localhost:5432/tradex_test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
